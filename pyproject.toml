[project]
name = "trading-engine"
version = "0.1.0"
description = "Motor de trading multi-estrategia (WIN/B3) - porte da StdDevVolumeBreakout v5.10"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]          # somente Windows (maquina de producao)
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
engine = "engine.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

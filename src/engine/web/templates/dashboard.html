{% extends "base.html" %}

{% block title %}Dashboard — Trading Engine{% endblock %}

{% block content %}
<h2>Dashboard</h2>

<!-- Status principal (SSE — F7f) -->
<div id="status-container"
     hx-ext="sse"
     sse-connect="/stream"
     sse-swap="message">
  <article class="card"><p>Conectando ao stream...</p></article>
</div>

<!-- Equity curve (F7b-2) -->
<div class="card"
     hx-get="/api/equity"
     hx-trigger="load, every 10s"
     hx-swap="innerHTML">
  <h3>Equity Curve</h3>
  <article><p>Carregando equity...</p></article>
</div>

<!-- Tabela de trades (F7b-2) -->
<div class="card"
     hx-get="/api/trades?limit=20"
     hx-trigger="load, every 10s"
     hx-swap="innerHTML">
  <h3>Últimos Trades</h3>
  <article><p>Carregando trades...</p></article>
</div>

<div hx-get="/api/trades/log"
     hx-trigger="load, every 5s"
     hx-swap="innerHTML">
  <p>Carregando log de trades...</p>
</div>

{% endblock %}
